{% extends "base.html" %}

{% block title %}Вход в комнату - {{ room.name }}{% endblock %}

{% block content %}
<div class="join-room-page">
    <div class="join-room-container">
        <div class="join-room-header">
            <i class="fas fa-lock"></i>
            <h1>{{ room.name }}</h1>
            <p>Для входа в комнату требуется пароль</p>
        </div>

        <form method="POST" class="join-room-form">
            <div class="form-group">
                <label for="password">Пароль комнаты</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Введите пароль" autocomplete="off">
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-large">
                    <i class="fas fa-sign-in-alt"></i> Войти в комнату
                </button>
                <a href="{{ url_for('watch_together') }}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Назад
                </a>
            </div>
        </form>
        
        <div class="room-info">
            <p><i class="fas fa-user"></i> Создатель: {{ room.creator.username }}</p>
            <p><i class="fas fa-users"></i> Участников: {{ room.participants|length }}/{{ room.max_participants }}</p>
        </div>
    </div>
</div>

<style>
.join-room-page {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    padding: 20px;
}

.join-room-container {
    max-width: 450px;
    width: 100%;
    background: var(--card);
    border-radius: var(--radius);
    padding: 40px;
    box-shadow: var(--shadow);
    text-align: center;
}

.join-room-header i {
    font-size: 64px;
    color: var(--primary);
    margin-bottom: 20px;
}

.join-room-header h1 {
    font-size: 24px;
    margin-bottom: 10px;
    color: var(--text-dark);
}

.join-room-header p {
    color: var(--text-light);
    margin-bottom: 30px;
}

.join-room-form .form-group {
    margin-bottom: 25px;
}

.join-room-form label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: var(--text-dark);
    text-align: left;
}

.join-room-form input {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    font-size: 16px;
    background: var(--card);
    color: var(--text);
}

.join-room-form input:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(179, 128, 230, 0.1);
}

.form-actions {
    display: flex;
    gap: 15px;
    flex-direction: column;
}

.form-actions .btn {
    width: 100%;
    justify-content: center;
}

.room-info {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    color: var(--text-light);
}

.room-info p {
    margin: 8px 0;
}

.room-info i {
    width: 20px;
    margin-right: 8px;
    color: var(--primary);
}

@media (max-width: 768px) {
    .join-room-container {
        padding: 25px;
    }
}
</style>
{% endblock %}
