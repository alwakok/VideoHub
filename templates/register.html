{% extends "base.html" %}

{% block title %}Регистрация - VideoHUB{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h1><i class="fas fa-user-plus"></i> Регистрация</h1>
            <p>Создайте аккаунт для доступа к видео</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" required>
                <i class="fas fa-user input-icon"></i>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <i class="fas fa-envelope input-icon"></i>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required>
                <i class="fas fa-lock input-icon"></i>
            </div>

            <div class="form-group">
                <label for="confirm_password">Подтверждение пароля</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
                <i class="fas fa-lock input-icon"></i>
            </div>

            <!-- Блок пользовательского соглашения -->
            <div class="form-group terms-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="accept_terms" required>
                    <span>Я принимаю <a href="{{ url_for('terms') }}" target="_blank">пользовательское соглашение</a></span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>

            <div class="auth-footer">
                <p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
